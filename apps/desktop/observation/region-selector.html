<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; connect-src 'none'; base-uri 'none'; form-action 'none'">
  <title>微光指引 · 本人框选观察区域</title>
  <link rel="stylesheet" href="region-selector.css">
</head>
<body>
  <div id="shade" aria-hidden="true"></div>
  <div id="selection" hidden aria-hidden="true"><span id="dimensions"></span></div>
  <main class="instructions" aria-label="选择观察区域">
    <span class="eyebrow">暖暖只看，你选的这一小块</span>
    <h1>拖动鼠标，框出要学习的区域</h1>
    <p>尚未开启采集。系统共享所选屏幕，微光指引仅对框内内容做检测和按需脱敏分析。</p>
    <p id="selection-status" role="status" aria-live="polite">请选择至少 32 × 32 的区域；框选后按 Enter 确认，Esc 取消。</p>
    <div class="actions"><button id="cancel" type="button">取消 · Esc</button><button id="confirm" type="button" disabled>使用这个区域 · Enter</button></div>
  </main>
  <script src="region-selector.js"></script>
</body>
</html>
